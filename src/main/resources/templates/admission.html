
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admission Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 30px 15px;
            background: linear-gradient(135deg, #111a38, #3730a3, #6366f1);
            color: #172033;
        }

        header {
            text-align: center;
            color: white;
            margin: 10px 0 25px;
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            color: #e0e7ff;
        }

        .form-card {
            max-width: 650px;
            margin: auto;
            padding: 32px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 15px 45px #0003;
        }

        h2 {
            text-align: center;
            color: #3730a3;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
        }

        input, select {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            color: #172033;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #818cf8;
            border-color: #6366f1;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #3730a3;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #25215f;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #3730a3;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            color: #e0e7ff;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .form-card {
                padding: 22px;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 University Admission Portal</h1>
    <p>University Admission &amp; Automated Seat Allocation System</p>
</header>

<main class="form-card">
    <h2>Student Admission Form</h2>

    <form th:action="@{/admission/send-otp}"
          th:object="${student}"
          method="post">

        <label for="fullName">Full Name</label>
        <input type="text"
               id="fullName"
               th:field="*{fullName}"
               placeholder="Enter your full name"
               required>

        <label for="email">Email Address</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               placeholder="Enter your email"
               required>

        <label for="phone">Phone Number</label>
        <input type="tel"
               id="phone"
               th:field="*{phone}"
               placeholder="Enter your phone number"
               required>

        <label for="course">Preferred Course</label>
        <select id="course" th:field="*{course}" required>
            <option value="">-- Select Course --</option>

            <optgroup label="Science and Technology">
                <option value="BSc Information Technology">BSc Information Technology</option>
                <option value="BSc Computer Science">BSc Computer Science</option>
                <option value="BSc Mathematics">BSc Mathematics</option>
                <option value="BSc Physics">BSc Physics</option>
                <option value="BSc Chemistry">BSc Chemistry</option>
                <option value="BSc Statistics">BSc Statistics</option>
                <option value="BSc Data Science">BSc Data Science</option>
                <option value="BSc Artificial Intelligence">BSc Artificial Intelligence</option>
                <option value="BSc Cyber Security">BSc Cyber Security</option>
                <option value="BSc Biotechnology">BSc Biotechnology</option>
                <option value="BSc Microbiology">BSc Microbiology</option>
                <option value="BSc Botany">BSc Botany</option>
                <option value="BSc Zoology">BSc Zoology</option>
                <option value="BSc Environmental Science">BSc Environmental Science</option>
            </optgroup>

            <optgroup label="Computer Applications and Engineering">
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
                <option value="BTech Computer Science">BTech Computer Science</option>
                <option value="BTech Information Technology">BTech Information Technology</option>
                <option value="BTech Artificial Intelligence">BTech Artificial Intelligence</option>
                <option value="BTech Data Science">BTech Data Science</option>
                <option value="BTech Electronics">BTech Electronics</option>
                <option value="BTech Mechanical Engineering">BTech Mechanical Engineering</option>
                <option value="BTech Civil Engineering">BTech Civil Engineering</option>
                <option value="BTech Electrical Engineering">BTech Electrical Engineering</option>
            </optgroup>

            <optgroup label="Commerce and Management">
                <option value="BCom">BCom</option>
                <option value="BCom Accounting and Finance">BCom Accounting and Finance</option>
                <option value="BCom Banking and Insurance">BCom Banking and Insurance</option>
                <option value="BCom Financial Markets">BCom Financial Markets</option>
                <option value="BMS">BMS</option>
                <option value="BBA">BBA</option>
                <option value="MBA">MBA</option>
                <option value="BAF">BAF</option>
                <option value="BBI">BBI</option>
                <option value="BFM">BFM</option>
            </optgroup>

            <optgroup label="Arts and Humanities">
                <option value="BA">BA</option>
                <option value="BA English">BA English</option>
                <option value="BA Psychology">BA Psychology</option>
                <option value="BA Economics">BA Economics</option>
                <option value="BA Sociology">BA Sociology</option>
                <option value="BA Political Science">BA Political Science</option>
                <option value="BA History">BA History</option>
                <option value="BA Geography">BA Geography</option>
                <option value="BA Philosophy">BA Philosophy</option>
            </optgroup>

            <optgroup label="Other Professional Courses">
                <option value="Bachelor of Design">Bachelor of Design</option>
                <option value="Bachelor of Journalism">Bachelor of Journalism</option>
                <option value="Bachelor of Social Work">Bachelor of Social Work</option>
                <option value="Bachelor of Hotel Management">Bachelor of Hotel Management</option>
                <option value="Bachelor of Education">Bachelor of Education</option>
                <option value="Bachelor of Pharmacy">Bachelor of Pharmacy</option>
                <option value="Bachelor of Architecture">Bachelor of Architecture</option>
                <option value="Bachelor of Law">Bachelor of Law</option>
            </optgroup>
        </select>

        <label for="marks">Marks / Percentage</label>
        <input type="number"
               id="marks"
               th:field="*{marks}"
               min="0"
               max="100"
               step="0.01"
               placeholder="Enter marks out of 100"
               required>

        <button type="submit">Submit Application</button>
    </form>

    <a class="back" th:href="@{/}">← Back to Home</a>
</main>

<footer>
    © 2026 University Admission System
</footer>

</body>
</html>
