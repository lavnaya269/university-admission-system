
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admission Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #fce7f3, #ede9fe);
            color: #222;
        }

        header {
            background: linear-gradient(90deg, #4f46e5, #9333ea);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px #00000020;
        }

        h2 {
            text-align: center;
            color: #4f46e5;
        }

        .note {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
        }

        input, select {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
        }

        input:focus, select:focus {
            outline: 2px solid #818cf8;
            border-color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit {
            background: #4f46e5;
            color: white;
        }

        .submit:hover {
            background: #3730a3;
        }

        .reset {
            background: #e5e7eb;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .container {
                margin: 15px;
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 University Admission Portal</h1>
    <p>Your future begins here!</p>
</header>

<div class="container">
    <h2>Student Admission Form</h2>
    <p class="note">Please fill in all the required details.</p>

    <form th:action="@{/admission}"
          th:object="${student}"
          method="post">

        <div class="form-grid">

            <div class="field full-width">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName"
                       th:field="*{fullName}"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="field">
                <label for="email">Email Address *</label>
                <input type="email" id="email"
                       th:field="*{email}"
                       placeholder="example@gmail.com"
                       required>
            </div>

            <div class="field">
                <label for="phone">Mobile Number *</label>
                <input type="tel" id="phone"
                       th:field="*{phone}"
                       placeholder="Enter mobile number"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       required>
            </div>

            <div class="field full-width">
                <label for="course">Select Course *</label>
                <select id="course" th:field="*{course}" required>
                    <option value="">-- Choose Your Course --</option>
                    <option value="BSc Information Technology">B.Sc. Information Technology</option>
                    <option value="BSc Computer Science">B.Sc. Computer Science</option>
                    <option value="BCA">Bachelor of Computer Applications (BCA)</option>
                    <option value="BTech Computer Science">B.Tech Computer Science</option>
                    <option value="BTech Information Technology">B.Tech Information Technology</option>
                    <option value="BCom">Bachelor of Commerce (B.Com.)</option>
                    <option value="BMS">Bachelor of Management Studies (BMS)</option>
                    <option value="BBA">Bachelor of Business Administration (BBA)</option>
                    <option value="BA">Bachelor of Arts (BA)</option>
                    <option value="BSc Mathematics">B.Sc. Mathematics</option>
                    <option value="BSc Data Science">B.Sc. Data Science</option>
                    <option value="BSc Artificial Intelligence">B.Sc. Artificial Intelligence</option>
                </select>
            </div>

            <div class="field full-width">
                <label for="marks">12th Standard Marks (%) *</label>
                <input type="number" id="marks"
                       th:field="*{marks}"
                       placeholder="Enter percentage"
                       min="0" max="100" step="0.01"
                       required>
            </div>

        </div>

        <div class="buttons">
            <button type="submit" class="submit">
                Submit Application
            </button>

            <button type="reset" class="reset">
                Clear Form
            </button>
        </div>

    </form>

    <a class="back" th:href="@{/}">← Back to Home</a>
</div>

</body>
</html>
