
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #111a38, #3730a3, #6366f1);
        }
        .card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 45px #0003;
        }
        h1 { color: #3730a3; text-align: center; }
        p { color: #475569; text-align: center; line-height: 1.6; }
        label { display: block; margin: 22px 0 8px; font-weight: 600; }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #3730a3;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .error { color: #dc2626; }
        a { display: block; margin-top: 20px; text-align: center; color: #3730a3; }
    </style>
</head>
<body>
<div class="card">
    <h1>🎓 Student Login</h1>
    <p>Enter your registered email address to receive a login OTP.</p>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:action="@{/student/login/send-otp}" method="post">
        <label for="email">Email Address</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your registered email"
               autocomplete="email"
               required>

        <button type="submit">Send Login OTP</button>
    </form>

    <a th:href="@{/}">← Back to Home</a>
</div>
</body>
</html>
