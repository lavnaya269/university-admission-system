
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 18px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }
        .card {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px #0001;
        }
        h1 { color: #3730a3; margin-bottom: 10px; }
        .subtitle { color: #64748b; margin-bottom: 25px; }
        .item {
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .label { color: #64748b; font-size: 14px; }
        .value { margin-top: 5px; font-weight: 600; overflow-wrap: anywhere; }
        .button {
            display: block;
            margin-top: 25px;
            padding: 13px;
            text-align: center;
            border-radius: 9px;
            background: #3730a3;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome, <span th:text="${student.fullName}">Student</span>! 🎉</h1>
    <p class="subtitle">Your University Admission Dashboard</p>

    <div class="item">
        <div class="label">Full Name</div>
        <div class="value" th:text="${student.fullName}"></div>
    </div>

    <div class="item">
        <div class="label">Email Address</div>
        <div class="value" th:text="${student.email}"></div>
    </div>

    <div class="item">
        <div class="label">Phone Number</div>
        <div class="value" th:text="${student.phone}"></div>
    </div>

    <div class="item">
        <div class="label">Preferred Course</div>
        <div class="value" th:text="${student.course}"></div>
    </div>

    <div class="item">
        <div class="label">Marks / Percentage</div>
        <div class="value" th:text="${student.marks}"></div>
    </div>

    <div class="item">
        <div class="label">Application Status</div>
        <div class="value" th:text="${student.allocationStatus}"></div>
    </div>

    <div class="item">
        <div class="label">Allocated Course</div>
        <div class="value"
             th:text="${student.allocatedCourse != null ? student.allocatedCourse : 'Not allocated yet'}"></div>
    </div>

    <a class="button" th:href="@{/student/logout}">Logout</a>
</div>
</body>
</html>
